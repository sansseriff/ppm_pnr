      static_sim.json: photon-number model built from the 28 dB preamble (analysis/build_pnr_model.py).<br>
      pnr_refit.json: prior-free photon-number statistics (analysis/pnr_refit.py).<br>
      MANIFEST_ppm_10ghz_decoded.txt: md5 and size of every file.</p>
