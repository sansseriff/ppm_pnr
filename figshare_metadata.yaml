# Datasets for this repository, one figshare item per subset so that subsets can be downloaded separately.
# Used by figshare_download.py (users) and tools/figshare_upload.py (maintainer).
# Each zip contains paths relative to the repository root; `extract_to: .` unpacks it in place.
# Fields filled by tools: zip, zip_size, zip_md5, unpacked_size, manifest, files (package_datasets.py);
# article_id, doi, url_private_html, url_public_html, file_id (figshare_upload.py).
project:
  title: ppm_pnr_datasets
  description: >-
    Data for the manuscript "Data Recovery and Pulse Position Modulation with a Photon Number Resolving SNSPD"
    (A. Mueller, B. Korzh, E. Wollman, A. D. Beyer, I. Craiciu, M. D. Shaw, M. Spiropulu). Raw Swabian Time
    Tagger files and decoded intermediate data for the 20 GHz and 10.75 GHz pulse-position-modulation (PPM)
    demonstrations, and the detector waveform data. Analysis code: https://github.com/sansseriff/ppm_pnr
  project_id: 283395
  url: https://figshare.com/account/projects/283395
common:
  license: CC BY 4.0
  defined_type: dataset
  categories: [30130, 26512, 30232]
  keywords:
  - superconducting nanowire single-photon detector
  - SNSPD
  - photon number resolution
  - pulse position modulation
  - optical communication
  - time tagging
  - Gaussian mixture model
  repo_url: https://github.com/sansseriff/ppm_pnr
datasets:
  ppm_20ghz_decoded:
    title: 'PPM with a photon-number-resolving SNSPD: 20 GHz decoded data'
    summary: 20 GHz decoded frames, preamble GMM fits and photon-number model (needed for Figs. 3-7, S1)
    extract_to: .
    description: >-
      <p>Decoded data for the 20 GHz (50 ps slot, 2048-ary) pulse-position-modulation demonstration, for
      attenuator settings 16-48 dB in 2 dB steps. These are the inputs to every figure-making script and notebook
      of the analysis repository (https://github.com/sansseriff/ppm_pnr).</p>
      <p>Contents (unzip into the repository root; files land in ppm_20ghz/inter/):<br>
      decode_20GHz{dB}.0.json: output of the decoder (ppm_20ghz/src_decode/JitRead_PPMSets_20GHz.py) for each
      attenuation: per-frame decode results for five repetitions of the transmission (slot estimate, true slot,
      raw (t_A, t_B) time tags), the preamble calibration points and 23 Gaussian-mixture fits of them, and the
      slope-correction lookup and histograms.<br>
      static_sim.json: photon-number model (groups of Gaussian components, photon number 1-4 and 5+) built from
      the 24 dB preamble.<br>
      pnr_refit.json: prior-free photon-number statistics (output of analysis/pnr_refit.py).<br>
      offset_correction_{dB}.json, max_offsets.json: alignment vectors and timing offsets used by the original
      (2023) Fig. 4 notebook.<br>
      MANIFEST_ppm_20ghz_decoded.txt: md5 and size of every file.</p>
      <p>Recommended: python figshare_download.py --dataset ppm_20ghz_decoded (from the repository root).</p>
