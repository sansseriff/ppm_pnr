  waveform:
    title: 'PPM with a photon-number-resolving SNSPD: detector waveform data'
    summary: trigger-level scan of the SNSPD output pulse (Fig. 2)
    extract_to: .
    description: >-
      <p>Detector waveform data used for Fig. 2 (pulse shape and trigger levels) of the manuscript. Analysis
      repository: https://github.com/sansseriff/ppm_pnr</p>
      <p>Contents (unzip into the repository root; files land in waveform/data/):<br>
      decent.npy: trigger-level scan of the amplified SNSPD output pulse recorded with the time tagger: a 2D
      histogram of trigger-crossing times (columns, ps) for trigger levels from about 5 to 60 mV (rows), which
      maps out the average pulse shape.<br>
      tigger_level_time_difference.json: the t_B - t_A delay (in ps) of single-photon pulses between the two
      trigger levels, derived from decent.npy by waveform/notebooks/main.ipynb and used by the 20 GHz notebooks.<br>
      MANIFEST_waveform.txt: md5 and size of every file.</p>
    zip: waveform.zip
