  ppm_20ghz_raw:
    title: 'PPM with a photon-number-resolving SNSPD: 20 GHz raw time tags'
    summary: 20 GHz raw Swabian Time Tagger files (16-50 dB) and AWG ground-truth sequences
    extract_to: .
    description: >-
      <p>Raw time-tag data of the 20 GHz (50 ps slot, 2048-ary) pulse-position-modulation demonstration with a
      differential SNSPD read out at two trigger levels. Analysis repository: https://github.com/sansseriff/ppm_pnr</p>
      <p>Contents (unzip into the repository root; files land in ppm_20ghz/data/):<br>
      measured/Sept10_20GHz/340s_.008_.050_Sept10_picScan_{dB}.0.1.ttbin: Swabian Time Tagger files
      (Time Tagger software 2.8), one 340 s acquisition per attenuator setting, 16-50 dB in 2 dB steps (50 dB
      was not used in the paper). The *.0.ttbin files are the 2.7 kB headers of each file set. Channels: 18 = AWG
      clock, -5 = low trigger level (t_A, 8 mV, falling-edge channel), -14 = high trigger level (t_B, 50 mV),
      9 = AWG sequence marker.<br>
      ground_truth.zip: the transmitted AWG sequences (yml: slot of every frame; bin: AWG waveform) and the
      sequence parameters (0_..._params.yml).<br>
      MANIFEST_ppm_20ghz_raw.txt: md5 and size of every file.</p>
      <p>Reading .ttbin files requires the Swabian Time Tagger software (Linux or Windows; the repository has a
      Docker image). Most users only need the decoded data item.</p>
